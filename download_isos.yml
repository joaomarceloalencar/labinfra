---
- name: Baixar ISOs do Ubuntu
  hosts: ativos
  become: yes
  gather_facts: no

  vars:
    iso_url_server: https://s3.ufcquixada.ia.br/imagensiso/ubuntu-24.04.4-live-server-amd64.iso
    iso_url_desktop: https://s3.ufcquixada.ia.br/imagensiso/ubuntu-24.04.4-desktop-amd64.iso
    destino: /home/labinfra/iso

  tasks:
    - name: Criar diretório para ISOs
      shell: sudo mkdir -p {{ destino }} && sudo chown labinfra:labinfra {{ destino }}
      changed_when: true

    - name: Baixar ISO Server
      shell: |
        sudo -u labinfra wget --show-progress -c "{{ iso_url_server }}" -O {{ destino }}/ubuntu-24.04.4-live-server-amd64.iso
      changed_when: true

    - name: Baixar ISO Desktop
      shell: |
        sudo -u labinfra wget --show-progress -c "{{ iso_url_desktop }}" -O {{ destino }}/ubuntu-24.04.4-desktop-amd64.iso
      changed_when: true

    - name: Definir permissões das ISOs
      shell: |
        sudo chown labinfra:labinfra {{ destino }}/*.iso && sudo chmod 664 {{ destino }}/*.iso
      changed_when: true