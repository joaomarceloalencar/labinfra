---
- name: Instalar Docker
  hosts: ativos
  become: yes
  gather_facts: no

  tasks:
    - name: Atualizar cache de pacotes
      shell: sudo apt-get update
      changed_when: true

    - name: Instalar pacotes necessários
      shell: sudo apt-get install -y ca-certificates curl gnupg
      changed_when: true

    - name: Criar diretório para keyring
      shell: sudo install -m 0755 -d /etc/apt/keyrings
      changed_when: true

    - name: Adicionar chave GPG do Docker
      shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      changed_when: true

    - name: Definir permissões da chave GPG
      shell: sudo chmod a+r /etc/apt/keyrings/docker.gpg
      changed_when: true

    - name: Adicionar repositório do Docker
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      changed_when: true

    - name: Atualizar cache após adicionar repositório
      shell: sudo apt-get update
      changed_when: true

    - name: Instalar Docker Engine
      shell: sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      changed_when: true

    - name: Adicionar usuário labinfra ao grupo docker
      shell: sudo usermod -aG docker labinfra
      changed_when: true

    - name: Adicionar usuário ufc ao grupo docker
      shell: sudo usermod -aG docker ufc
      changed_when: true

    - name: Habilitar Docker para iniciar no boot
      shell: sudo systemctl enable docker
      changed_when: true

    - name: Iniciar serviço Docker
      shell: sudo systemctl start docker
      changed_when: true
