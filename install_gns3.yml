---
- name: Instalar GNS3
  hosts: ativos
  become: yes
  gather_facts: no

  tasks:
    - name: Configurar debconf para aceitar automaticamente
      shell: |
        echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
        echo 'wireshark-common wireshark-common/install-setuid boolean true' | sudo debconf-set-selections
      changed_when: true

    - name: Adicionar repositório PPA do GNS3
      shell: sudo add-apt-repository ppa:gns3/ppa -y
      changed_when: true

    - name: Atualizar cache de pacotes
      shell: sudo apt-get update
      changed_when: true

    - name: Instalar GNS3 (gui e server) com respostas automáticas
      shell: |
        DEBIAN_FRONTEND=noninteractive sudo -E apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" gns3-gui gns3-server
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true
      async: 3600
      poll: 15

    - name: Adicionar usuário ufc ao grupo de usuários GNS3
      shell: |
        sudo usermod -aG ubridge ufc 2>/dev/null || true
        sudo usermod -aG libvirt ufc 2>/dev/null || true
        sudo usermod -aG kvm ufc 2>/dev/null || true
        sudo usermod -aG wireshark ufc 2>/dev/null || true
      changed_when: true

    - name: Adicionar usuário labinfra ao grupo de usuários GNS3 (se existir)
      shell: |
        if id labinfra &>/dev/null; then
          sudo usermod -aG ubridge labinfra 2>/dev/null || true
          sudo usermod -aG libvirt labinfra 2>/dev/null || true
          sudo usermod -aG kvm labinfra 2>/dev/null || true
          sudo usermod -aG wireshark labinfra 2>/dev/null || true
        fi
      changed_when: false
