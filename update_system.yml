---
- name: Atualizar sistema
  hosts: ativos
  become: yes
  gather_facts: no

  tasks:
    - name: Atualizar cache de pacotes
      shell: sudo apt-get update
      changed_when: true

    - name: Fazer dist-upgrade
      shell: sudo apt-get dist-upgrade -y
      changed_when: true

    - name: Limpar pacotes desnecessários
      shell: sudo apt-get autoremove -y && sudo apt-get autoclean
      changed_when: true