---
- name: Instalar pré-requisitos
  hosts: ativos
  become: yes
  gather_facts: no

  tasks:
    - name: Atualizar cache de pacotes
      shell: sudo apt-get update
      changed_when: true

    - name: Instalar curl
      shell: sudo apt-get install -y curl
      changed_when: true

    - name: Instalar python3-cffi
      shell: sudo apt-get install -y python3-cffi
      changed_when: true

    - name: Instalar python3-pip
      shell: sudo apt-get install -y python3-pip
      changed_when: true

    - name: Instalar python3-apt
      shell: sudo apt-get install -y python3-apt
      changed_when: true

    - name: Instalar python3-dnspython
      shell: sudo apt-get install -y python3-dnspython
      changed_when: true

    - name: Instalar sshpass
      shell: sudo apt-get install -y sshpass
      changed_when: true